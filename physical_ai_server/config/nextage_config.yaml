physical_ai_server:
  ros__parameters:
    nextage:
      observation_list:
        - cam_top
        - cam_wrist_right
        - cam_wrist_left # Enable after D405 image reception is confirmed.
        - state

      camera_topic_list:
        - cam_top:/top_camera/color/image_raw/compressed
        - cam_wrist_right:/rhand_camera/image_raw/compressed
        - cam_wrist_left:/lhand_camera/color/image_rect_raw/compressed

      joint_topic_list:
        - follower_nextage:/joint_states
        - leader_nextage:/fullbody_controller/follow_joint_trajectory_action/recording_trajectory

      joint_list:
        - leader_nextage
      joint_order:
        leader_nextage:
          - CHEST_JOINT0
          - HEAD_JOINT0
          - HEAD_JOINT1
          - RARM_JOINT0
          - RARM_JOINT1
          - RARM_JOINT2
          - RARM_JOINT3
          - RARM_JOINT4
          - RARM_JOINT5
          - LARM_JOINT0
          - LARM_JOINT1
          - LARM_JOINT2
          - LARM_JOINT3
          - LARM_JOINT4
          - LARM_JOINT5

      # Additional raw topics; these do not become LeRobot action features.
      rosbag_extra_topic_list:
        - /tf
        - /tf_static
        - /robot_description
        - /left_ft/robot_description
        - /right_ft/robot_description
        - /left_ft/force_torque
        - /right_ft/force_torque
